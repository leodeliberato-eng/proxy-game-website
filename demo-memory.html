<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Match</title>
    <style>
      body {
        background: #0b1020;
        color: white;
        font-family: Arial, sans-serif;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .memory-wrap {
        text-align: center;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 80px);
        gap: 10px;
        margin-top: 20px;
      }
      .card {
        width: 80px;
        height: 80px;
        border-radius: 12px;
        border: 2px solid #4ea1ff;
        background: #111827;
        color: white;
        font-size: 36px;
        font-weight: bold;
        cursor: pointer;
      }
      .card.flipped {
        background: #4ea1ff;
      }
      .status {
        margin-top: 12px;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <div class="memory-wrap">
      <h2>Memory Match</h2>
      <div class="grid" id="grid"></div>
      <div class="status" id="status">Find all pairs</div>
    </div>

    <script>
      const emojis = ['🍉', '🍋', '🍇', '🍒', '🍊', '🍎', '🍋', '🍇', '🍒', '🍊', '🍎', '🍉'];
      const grid = document.getElementById('grid');
      const status = document.getElementById('status');
      let cards = [];
      let flipped = [];
      let lock = false;

      function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }

      function buildBoard() {
        cards = shuffle([...emojis]);
        grid.innerHTML = '';
        for (let i = 0; i < cards.length; i++) {
          const card = document.createElement('button');
          card.className = 'card';
          card.dataset.value = cards[i];
          card.textContent = '❔';
          card.addEventListener('click', () => flipCard(card));
          grid.appendChild(card);
        }
      }

      function flipCard(card) {
        if (lock || card.classList.contains('flipped') || flipped.includes(card)) return;

        card.classList.add('flipped');
        card.textContent = card.dataset.value;
        flipped.push(card);

        if (flipped.length === 2) {
          lock = true;
          const [first, second] = flipped;

          if (first.dataset.value === second.dataset.value) {
            status.textContent = 'Nice match!';
            setTimeout(() => {
              first.disabled = true;
              second.disabled = true;
              flipped = [];
              lock = false;
              checkWin();
            }, 500);
          } else {
            status.textContent = 'Try again';
            setTimeout(() => {
              first.textContent = '❔';
              second.textContent = '❔';
              first.classList.remove('flipped');
              second.classList.remove('flipped');
              flipped = [];
              lock = false;
            }, 800);
          }
        }
      }

      function checkWin() {
        const remaining = [...document.querySelectorAll('.card')].filter(card => !card.disabled);
        if (remaining.length === 0) {
          status.textContent = 'You won! 🎉';
        } else {
          status.textContent = 'Find all pairs';
        }
      }

      buildBoard();
    </script>
  </body>
</html>
