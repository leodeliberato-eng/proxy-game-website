<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proxy Play</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="logo">🎮</span>
          <h1>Proxy Play</h1>
        </div>

        <form id="proxy-form" class="proxy-form">
          <label for="game-url">Game or site URL</label>
          <input
            id="game-url"
            type="url"
            placeholder="https://example.com"
            required
          />
          <button type="submit">Launch</button>
        </form>

        <div class="quick-launch">
          <h2>Quick games</h2>
          <button class="demo-btn" data-url="demo-snake.html">Snake</button>
          <button class="demo-btn" data-url="demo-memory.html">Memory</button>
        </div>
      </aside>

      <main class="game-panel">
        <div class="toolbar">
          <span id="status-text">Ready to launch</span>
        </div>

        <div class="frame-wrap">
          <iframe
            id="game-frame"
            title="Game Frame"
            src="demo-snake.html"
            allowfullscreen
          ></iframe>
        </div>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
